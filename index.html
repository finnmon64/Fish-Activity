<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#115ec1" />
  <title>Fish Activity</title>
  <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
  <style>
    :root {
      --bg-top: #115ec1;
      --bg-bottom: #186bd4;
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.68);
      --grid-line: rgba(255, 255, 255, 0.14);
      --highlight: #ffeb3b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Roboto", "Segoe UI", sans-serif; }
    body {
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }
    .app-shell { width: 100%; max-width: 440px; min-height: 100vh; display: flex; flex-direction: column; position: relative; padding-bottom: 70px; }

    header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 4px; }
    header h1 { font-size: 1.25rem; font-weight: 500; }

    .date-strip { display: grid; grid-template-columns: repeat(7, 1fr); padding: 6px 10px; text-align: center; }
    .date-item { padding: 6px 0; cursor: pointer; color: var(--text-muted); border-bottom: 2.5px solid transparent; }
    .date-item.active { color: #fff; border-bottom-color: #fff; font-weight: 600; }
    .date-item .day-num { font-size: 1.15rem; margin-bottom: 2px; }
    .date-item .day-name { font-size: 0.7rem; text-transform: uppercase; }

    .loc-row { display: flex; justify-content: flex-end; padding: 4px 18px 0; }
    .loc-select {
      background: rgba(0, 0, 0, 0.2);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 14px;
      padding: 4px 10px;
      font-size: 0.8rem;
      outline: none;
    }
    .loc-select option { background: #115ec1; }

    .score-section { display: flex; flex-direction: column; align-items: center; margin: 6px 0 8px; }
    .gauge-box { width: 110px; height: 110px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .gauge-svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    .score-val { font-size: 2.5rem; font-weight: 600; line-height: 1; }
    .stars-val { font-size: 0.8rem; letter-spacing: 2px; margin-top: 3px; min-height: 15px; }
    .label-val { font-size: 1.1rem; font-weight: 500; margin-top: 6px; }

    /* Scrub Readout Bar */
    .scrub-info {
      height: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #fff;
      margin-bottom: 2px;
    }
    .scrub-pill {
      background: rgba(255,255,255,0.2);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
    }

    /* Chart with reserved space for high/med/low labels */
    .chart-container { position: relative; width: 100%; height: 210px; touch-action: none; }
    .band-label { position: absolute; left: 8px; font-size: 0.65rem; font-weight: 600; color: rgba(255,255,255,0.65); pointer-events: none; }
    .band-high { top: 20px; }
    .band-med { top: 78px; }
    .band-low { top: 136px; }
    #curve-svg { width: 100%; height: 100%; display: block; }

    /* Window Cards */
    .times-grid { display: grid; grid-template-columns: 1fr 1fr; padding: 12px 16px; gap: 10px; text-align: center; }
    .times-col h3 { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
    .time-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 6px 4px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .time-card.active-window {
      background: rgba(255, 235, 59, 0.25);
      border-color: var(--highlight);
      box-shadow: 0 0 8px rgba(255, 235, 59, 0.4);
    }
    .time-card-text { font-size: 0.82rem; font-weight: 500; }
    .day-offset { display: block; font-size: 0.65rem; color: var(--text-muted); font-style: italic; }

    .fab-cal {
      position: fixed;
      bottom: 18px;
      right: max(18px, calc(50vw - 200px));
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #ffffff;
      color: #115ec1;
      border: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      font-size: 1.25rem;
      cursor: pointer;
    }
    #date-picker { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <h1>Fish activity</h1>
    </header>

    <div class="date-strip" id="date-strip"></div>

    <div class="loc-row">
      <select class="loc-select" id="loc-select">
        <option value="-41.0910,174.7830">Mana Island</option>
        <option value="-41.2866,174.8300">Wellington Harbour</option>
        <option value="-41.3480,174.7700">South Coast</option>
      </select>
    </div>

    <div class="score-section">
      <div class="gauge-box">
        <svg class="gauge-svg" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="48" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="8" stroke-dasharray="2 3.02" />
          <circle id="gauge-ticks" cx="60" cy="60" r="48" fill="none" stroke="#fff" stroke-width="8" stroke-dasharray="2 3.02" stroke-dashoffset="301.6" />
        </svg>
        <div class="score-val" id="score-val">--</div>
        <div class="stars-val" id="stars-val"></div>
      </div>
      <div class="label-val" id="label-val">--</div>
    </div>

    <div class="scrub-info" id="scrub-bar">
      <span>Drag curve to view hours</span>
    </div>

    <div class="chart-container" id="chart-area">
      <span class="band-label band-high">HIGH</span>
      <span class="band-label band-med">MEDIUM</span>
      <span class="band-label band-low">LOW</span>
      <svg id="curve-svg" viewBox="0 0 440 210" preserveAspectRatio="none"></svg>
    </div>

    <div class="times-grid">
      <div class="times-col">
        <h3>Major Times</h3>
        <div id="major-list"></div>
      </div>
      <div class="times-col">
        <h3>Minor Times</h3>
        <div id="minor-list"></div>
      </div>
    </div>

    <button class="fab-cal" id="cal-btn">📅</button>
    <input type="date" id="date-picker" />
  </div>

  <script>
    const TZ = 'Pacific/Auckland';
    let currentCoords = { lat: -41.0910, lon: 174.7830 };
    let selectedDate = new Date();
    selectedDate.setHours(12, 0, 0, 0);

    let activeHighlight = null; // { startHr, endHr }
    let scrubHour = null;

    function getLocalDayBounds(d) {
      const start = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0, 0);
      const end = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, 0, 0, 0);
      return { start, end };
    }

    function calculateSolunar(date, loc) {
      const observer = new Astronomy.Observer(loc.lat, loc.lon, 0);
      const { start: dayStart, end: dayEnd } = getLocalDayBounds(date);
      const midDay = new Date(dayStart.getTime() + 12 * 3600000);

      // Phase score with post-syzygy lag
      const phase = Astronomy.MoonPhase(midDay);
      const laggedRad = ((phase - 11.0) * Math.PI) / 180.0;
      const score = Math.max(5, Math.min(100, Math.round(54.5 + 42.5 * Math.cos(2 * laggedRad))));

      // Major (transits) & Minor (rise/set)
      const searchStart = new Date(dayStart.getTime() - 6 * 3600000);
      const searchEnd = new Date(dayEnd.getTime() + 6 * 3600000);

      const majors = [];
      const minors = [];

      [0, 12].forEach(ha => {
        let t = searchStart;
        while (t < searchEnd) {
          const ev = Astronomy.SearchHourAngle(Astronomy.Body.Moon, observer, ha, t);
          if (!ev || ev.time.date >= searchEnd) break;
          majors.push(ev.time.date);
          t = new Date(ev.time.date.getTime() + 16 * 3600000);
        }
      });

      [+1, -1].forEach(dir => {
        let t = searchStart;
        while (t < searchEnd) {
          const ev = Astronomy.SearchRiseSet(Astronomy.Body.Moon, observer, dir, t, 1);
          if (!ev || ev.date >= searchEnd) break;
          minors.push(ev.date);
          t = new Date(ev.date.getTime() + 16 * 3600000);
        }
      });

      majors.sort((a,b) => a - b);
      minors.sort((a,b) => a - b);

      return { score, majors, minors, dayStart, dayEnd };
    }

    function formatTimeStr(date) {
      let h = date.getHours();
      const m = date.getMinutes();
      const ampm = h >= 12 ? 'pm' : 'am';
      h = h % 12 || 12;
      return `${h}:${m < 10 ? '0' : ''}${m} ${ampm}`;
    }

    function buildWindowCard(centerDate, halfWidthHr, dayStart, dayEnd, id) {
      const s = new Date(centerDate.getTime() - halfWidthHr * 3600000);
      const e = new Date(centerDate.getTime() + halfWidthHr * 3600000);

      const startHr = (s.getTime() - dayStart.getTime()) / 3600000;
      const endHr = (e.getTime() - dayStart.getTime()) / 3600000;

      let sub = '';
      if (s < dayStart) sub = '<span class="day-offset">previous day</span>';
      else if (e >= dayEnd) sub = '<span class="day-offset">next day</span>';

      const isSelected = activeHighlight && activeHighlight.id === id;

      return `
        <div class="time-card ${isSelected ? 'active-window' : ''}" 
             onclick="toggleHighlight('${id}', ${startHr}, ${endHr})">
          <div class="time-card-text">${formatTimeStr(s)} – ${formatTimeStr(e)}${sub}</div>
        </div>
      `;
    }

    window.toggleHighlight = function(id, sHr, eHr) {
      if (activeHighlight && activeHighlight.id === id) {
        activeHighlight = null;
      } else {
        activeHighlight = { id, sHr, eHr };
      }
      render();
    };

    let currentSolunarData = null;

    function evaluateActivity(hr, data) {
      const tMs = data.dayStart.getTime() + hr * 3600000;
      const base = 12 + (data.score / 100) * 38;
      const majorAmp = 26 + (data.score / 100) * 18;
      const minorAmp = 15 + (data.score / 100) * 10;
      let v = base;

      data.majors.forEach(m => {
        const dt = (tMs - m.getTime()) / 3600000;
        if (Math.abs(dt) <= 2.2) {
          const w = Math.cos((Math.PI * dt) / 2.2);
          v += majorAmp * Math.pow(Math.max(0, w), 1.6);
        }
        if (Math.abs(dt) > 1.4 && Math.abs(dt) <= 3.2) {
          v -= 3.5 * Math.sin(((Math.abs(dt) - 1.4) / 1.8) * Math.PI);
        }
      });

      data.minors.forEach(m => {
        const dt = (tMs - m.getTime()) / 3600000;
        if (Math.abs(dt) <= 1.55) {
          const w = Math.cos((Math.PI * dt) / 1.55);
          v += minorAmp * Math.pow(Math.max(0, w), 1.7);
        }
      });

      return Math.max(4, Math.min(96, v));
    }

    function render() {
      const data = calculateSolunar(selectedDate, currentCoords);
      currentSolunarData = data;
      const score = data.score;

      document.getElementById('score-val').textContent = score;

      let stars = '';
      if (score >= 90) stars = '★★★';
      else if (score >= 40) stars = '★★';
      else if (score >= 20) stars = '★';
      document.getElementById('stars-val').textContent = stars;

      let label = 'Very high fish activity';
      if (score < 20) label = 'Very low fish activity';
      else if (score < 40) label = 'Low fish activity';
      else if (score < 70) label = 'Average fish activity';
      else if (score < 85) label = 'High fish activity';
      document.getElementById('label-val').textContent = label;

      const offset = 301.59 * (1 - score / 100);
      document.getElementById('gauge-ticks').style.strokeDashoffset = offset.toFixed(2);

      // Windows strictly falling on this calendar day
      const dayMajors = data.majors.filter(t => t >= data.dayStart && t < data.dayEnd);
      const dayMinors = data.minors.filter(t => t >= data.dayStart && t < data.dayEnd);

      document.getElementById('major-list').innerHTML = dayMajors.map((t, idx) => 
        buildWindowCard(t, 1.25, data.dayStart, data.dayEnd, 'maj_' + idx)
      ).join('') || '<div class="time-card"><div class="time-card-text">–</div></div>';

      document.getElementById('minor-list').innerHTML = dayMinors.map((t, idx) => 
        buildWindowCard(t, 0.75, data.dayStart, data.dayEnd, 'min_' + idx)
      ).join('') || '<div class="time-card"><div class="time-card-text">–</div></div>';

      drawChart(data);
    }

    function drawChart(data) {
      const svg = document.getElementById('curve-svg');
      const W = 440, H = 210;
      const leftPad = 64; // Clears HIGH/MED/LOW text
      const rightPad = 12;
      const topPad = 20;
      const botPad = 32;
      const graphW = W - leftPad - rightPad;
      const graphH = H - topPad - botPad;

      // 1. Gridlines
      const yHigh = topPad + graphH * 0.18;
      const yMed = topPad + graphH * 0.52;
      const yLow = topPad + graphH * 0.86;

      let svgHTML = `
        <line x1="${leftPad}" y1="${yHigh}" x2="${W - rightPad}" y2="${yHigh}" stroke="var(--grid-line)" stroke-dasharray="3,3" />
        <line x1="${leftPad}" y1="${yMed}" x2="${W - rightPad}" y2="${yMed}" stroke="var(--grid-line)" stroke-dasharray="3,3" />
        <line x1="${leftPad}" y1="${yLow}" x2="${W - rightPad}" y2="${yLow}" stroke="var(--grid-line)" stroke-dasharray="3,3" />
      `;

      // 2. Vertical Hours
      const hrs = [4, 8, 12, 16, 20];
      const hrLabels = ['4:00 am', '8:00 am', '12:00 pm', '4:00 pm', '8:00 pm'];
      hrs.forEach((h, i) => {
        const x = leftPad + (h / 24) * graphW;
        svgHTML += `
          <line x1="${x}" y1="${topPad - 6}" x2="${x}" y2="${H - botPad}" stroke="var(--grid-line)" />
          <text x="${x}" y="${H - 10}" fill="rgba(255,255,255,0.7)" font-size="10.5" text-anchor="middle">${hrLabels[i]}</text>
        `;
      });

      // 3. Highlighted Window Band
      if (activeHighlight) {
        const x1 = Math.max(leftPad, leftPad + (activeHighlight.sHr / 24) * graphW);
        const x2 = Math.min(W - rightPad, leftPad + (activeHighlight.endHr / 24) * graphW);
        if (x2 > x1) {
          svgHTML += `<rect x="${x1}" y="${topPad}" width="${x2 - x1}" height="${graphH}" fill="rgba(255, 235, 59, 0.22)" stroke="none" />`;
        }
      }

      // 4. Sample Continuous Wave
      const pts = [];
      const steps = 96;
      for (let i = 0; i <= steps; i++) {
        const hr = (i / steps) * 24;
        const x = leftPad + (hr / 24) * graphW;
        const act = evaluateActivity(hr, data);
        const y = topPad + graphH * (1 - act / 100);
        pts.push({ x, y, hr, act });
      }

      const lineD = pts.map((p, idx) => `${idx === 0 ? 'M' : 'L'} ${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
      const fillD = `${lineD} L ${(W - rightPad).toFixed(1)},${H - botPad} L ${leftPad},${H - botPad} Z`;

      svgHTML += `
        <defs>
          <linearGradient id="curveGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
          </linearGradient>
        </defs>
        <path d="${fillD}" fill="url(#curveGrad)" stroke="none" />
        <path d="${lineD}" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
      `;

      // 5. Red Dot (Current Time if viewing today)
      const now = new Date();
      if (now >= data.dayStart && now < data.dayEnd) {
        const curHr = (now - data.dayStart) / 3600000;
        const curX = leftPad + (curHr / 24) * graphW;
        const curY = topPad + graphH * (1 - evaluateActivity(curHr, data) / 100);
        svgHTML += `<circle cx="${curX.toFixed(1)}" cy="${curY.toFixed(1)}" r="5.5" fill="#e53935" stroke="#ffffff" stroke-width="2" />`;
      }

      // 6. Interactive Scrub Cursor
      if (scrubHour !== null) {
        const sx = leftPad + (scrubHour / 24) * graphW;
        const sAct = evaluateActivity(scrubHour, data);
        const sy = topPad + graphH * (1 - sAct / 100);
        svgHTML += `
          <line x1="${sx}" y1="${topPad}" x2="${sx}" y2="${H - botPad}" stroke="#ffeb3b" stroke-width="1.5" stroke-dasharray="2,2" />
          <circle cx="${sx}" cy="${sy}" r="5" fill="#ffeb3b" stroke="#000" stroke-width="1.5" />
        `;
      }

      svg.innerHTML = svgHTML;
    }

    // Touch & Mouse Scrubbing over Curve
    const chartArea = document.getElementById('chart-area');

    function handleScrub(e) {
      if (!currentSolunarData) return;
      const rect = chartArea.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const W = 440;
      const leftPad = 64;
      const rightPad = 12;
      const graphW = W - leftPad - rightPad;

      // Scale to SVG coordinate space
      const scale = W / rect.width;
      const clickX = (clientX - rect.left) * scale;
      const clampedX = Math.max(leftPad, Math.min(W - rightPad, clickX));
      const hr = ((clampedX - leftPad) / graphW) * 24;

      scrubHour = Math.max(0, Math.min(24, hr));

      // Calculate time readout
      const totalMinutes = Math.round(scrubHour * 60);
      let h = Math.floor(totalMinutes / 60) % 24;
      const m = totalMinutes % 60;
      const ampm = h >= 12 ? 'pm' : 'am';
      const h12 = h % 12 || 12;
      const timeStr = `${h12}:${m < 10 ? '0' : ''}${m} ${ampm}`;

      const act = Math.round(evaluateActivity(scrubHour, currentSolunarData));
      let lvl = 'Low';
      if (act >= 70) lvl = 'High';
      else if (act >= 40) lvl = 'Medium';

      document.getElementById('scrub-bar').innerHTML = `
        <span class="scrub-pill">${timeStr}</span>
        <span>Activity: <strong>${act}%</strong> (${lvl})</span>
      `;

      drawChart(currentSolunarData);
    }

    chartArea.addEventListener('pointerdown', (e) => { handleScrub(e); chartArea.setPointerCapture(e.pointerId); });
    chartArea.addEventListener('pointermove', (e) => { if (e.buttons) handleScrub(e); });
    chartArea.addEventListener('pointerup', () => {
      // Optional: keep last position or reset
    });

    // Date Strip
    function renderDateStrip() {
      const strip = document.getElementById('date-strip');
      strip.innerHTML = '';
      const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
      const today = new Date();

      for (let offset = -3; offset <= 3; offset++) {
        const d = new Date(selectedDate);
        d.setDate(selectedDate.getDate() + offset);
        const isToday = d.toDateString() === today.toDateString();

        const cell = document.createElement('div');
        cell.className = `date-item ${offset === 0 ? 'active' : ''}`;
        cell.innerHTML = `
          <div class="day-num">${d.getDate()}</div>
          <div class="day-name">${isToday ? 'TODAY' : days[d.getDay()]}</div>
        `;
        cell.addEventListener('click', () => {
          selectedDate = d;
          activeHighlight = null;
          scrubHour = null;
          document.getElementById('scrub-bar').innerHTML = `<span>Drag curve to view hours</span>`;
          renderDateStrip();
          render();
        });
        strip.appendChild(cell);
      }
    }

    // Handlers
    document.getElementById('loc-select').addEventListener('change', (e) => {
      const [lat, lon] = e.target.value.split(',').map(Number);
      currentCoords = { lat, lon };
      render();
    });

    const picker = document.getElementById('date-picker');
    document.getElementById('cal-btn').addEventListener('click', () => {
      if (picker.showPicker) picker.showPicker();
      else picker.click();
    });
    picker.addEventListener('change', (e) => {
      if (!e.target.value) return;
      const [y, m, d] = e.target.value.split('-').map(Number);
      selectedDate = new Date(y, m - 1, d, 12, 0, 0);
      activeHighlight = null;
      renderDateStrip();
      render();
    });

    renderDateStrip();
    render();
  </script>
</body>
</html>
