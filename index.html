<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#105cc0" />
  <title>Fish Activity & Mission Control</title>
  <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg-top: #105cc0;
      --bg-bottom: #1668cf;
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.72);
      --grid-line: rgba(255, 255, 255, 0.16);
      --card-bg: rgba(0, 0, 0, 0.18);
      --burley-green: #00e676;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Roboto", sans-serif; }
    body { background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }
    .app-shell { width: 100%; max-width: 440px; min-height: 100vh; margin: 0 auto; display: flex; flex-direction: column; padding-bottom: 70px; }

    /* Tabs Logic */
    .tab-content { display: none; flex-direction: column; flex-grow: 1; }
    .tab-content.active { display: flex; }

    /* Header & Date Strip */
    header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 4px; }
    header h1 { font-size: 1.25rem; font-weight: 500; }
    .date-strip { display: grid; grid-template-columns: repeat(7, 1fr); padding: 4px 10px 6px; text-align: center; }
    .date-item { padding: 6px 0; cursor: pointer; color: var(--text-muted); border-bottom: 2.5px solid transparent; }
    .date-item.active { color: #fff; border-bottom-color: #fff; font-weight: 600; }
    .date-item .day-num { font-size: 1.15rem; margin-bottom: 2px; }
    .date-item .day-name { font-size: 0.7rem; text-transform: uppercase; }

    /* Global UI Elements */
    .controls-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 16px 2px; gap: 8px; }
    .loc-select { background: rgba(0, 0, 0, 0.22); color: #fff; border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 16px; padding: 5px 10px; font-size: 0.8rem; outline: none; cursor: pointer; width: 100%; }
    .loc-select option { background: #105cc0; color: #fff; }
    .module-panel { background: rgba(0, 0, 0, 0.18); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 12px; margin: 10px 16px; }
    .module-header { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; color: #90caf9; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; }

    /* TAB 1: SOLUNAR */
    .score-section { display: flex; flex-direction: column; align-items: center; margin: 4px 0 6px; }
    .gauge-box { width: 110px; height: 110px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .gauge-svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    .score-val { font-size: 2.6rem; font-weight: 500; line-height: 1; margin-top: -2px; }
    .stars-val { font-size: 0.82rem; letter-spacing: 2px; margin-top: 3px; min-height: 14px; }
    .label-val { font-size: 1.12rem; font-weight: 500; margin-top: 6px; }
    .chart-container { position: relative; width: 100%; height: 214px; margin-top: 2px; }
    .band-label { position: absolute; left: 8px; font-size: 0.63rem; font-weight: 600; color: rgba(255,255,255,0.7); }
    .band-high { top: 22px; } .band-med { top: 82px; } .band-low { top: 142px; }
    #curve-svg { width: 100%; height: 100%; display: block; }
    .times-grid { display: grid; grid-template-columns: 1fr 1fr; padding: 10px 16px 6px; gap: 10px; text-align: center; }
    .times-col h3 { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
    .time-card { background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 5px; padding: 6px 4px; margin-bottom: 6px; font-size: 0.85rem; }
    .tide-panel { margin: 4px 16px 12px; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 8px; padding: 10px 12px; }
    .tide-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .tide-diff-badge { background: rgba(255,255,255,0.14); padding: 2px 7px; border-radius: 10px; font-size: 0.68rem; }
    .tide-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 0.82rem; }
    .tide-item { background: rgba(255,255,255,0.06); padding: 5px 8px; border-radius: 4px; display: flex; justify-content: space-between; }
    .tide-type { font-weight: 600; color: #90caf9; }
    .burley-btn { background: rgba(0, 0, 0, 0.22); color: #fff; border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 16px; padding: 5px 12px; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 5px; }
    .burley-btn.active { background: var(--burley-green); color: #062b16; border-color: var(--burley-green); }
    .burley-box { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.14); display: none; }
    .burley-box.show { display: block; }
    .burley-title { font-size: 0.74rem; color: var(--burley-green); font-weight: 600; text-transform: uppercase; margin-bottom: 5px; }
    .burley-item { font-size: 0.8rem; margin-bottom: 4px; display: flex; justify-content: space-between; background: rgba(0, 230, 118, 0.12); padding: 5px 8px; border-radius: 4px; border: 1px solid rgba(0, 230, 118, 0.3); }

    /* TAB 2: ROUTING & TIMELINE */
    .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .input-group label { display: block; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 4px; }
    .input-group input, .input-group select { width: 100%; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 6px 8px; border-radius: 4px; font-size: 0.85rem; outline: none; }
    #map { width: 100%; height: 200px; border-radius: 6px; margin: 10px 0; background: #0b223d; z-index: 1; }
    .route-results { display: flex; justify-content: space-between; background: rgba(255,255,255,0.08); padding: 8px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: 500; }
    .spots-list { max-height: 90px; overflow-y: auto; background: rgba(0,0,0,0.1); padding: 6px; border-radius: 4px; margin-bottom: 8px; font-size: 0.8rem; }
    .spots-list label { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; cursor: pointer; }
    .timeline-box { margin-top: 10px; background: rgba(0, 0, 0, 0.25); padding: 12px; border-radius: 6px; border-left: 3px solid #ffeb3b; }
    .tl-row { display: flex; align-items: flex-start; margin-bottom: 10px; }
    .tl-row:last-child { margin-bottom: 0; }
    .tl-time { width: 65px; font-weight: 600; font-size: 0.8rem; color: #90caf9; flex-shrink: 0; }
    .tl-desc { font-size: 0.75rem; color: #fff; padding-left: 12px; border-left: 1px solid rgba(255, 255, 255, 0.2); line-height: 1.3; }
    .tl-desc strong { color: #fff; font-size: 0.8rem; letter-spacing: 0.2px; }

    /* TAB 3: CHECKLIST */
    .checklist-group { margin-bottom: 15px; }
    .checklist-group h4 { font-size: 0.8rem; color: #fff; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px; }
    .check-item { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; margin-bottom: 6px; }
    .check-item input[type="checkbox"] { width: 16px; height: 16px; }

    /* Bottom Nav Bar */
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #0c438f; display: flex; justify-content: space-around; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(255,255,255,0.1); z-index: 1000; }
    .nav-btn { display: flex; flex-direction: column; align-items: center; color: rgba(255,255,255,0.6); text-decoration: none; font-size: 0.7rem; gap: 4px; width: 33%; cursor: pointer; border: none; background: none; }
    .nav-btn.active { color: #fff; font-weight: 600; }
    .nav-icon { font-size: 1.4rem; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <h1>Fish Activity</h1>
    </header>
    <div class="date-strip" id="date-strip"></div>

    <!-- TAB 1: SOLUNAR -->
    <div id="tab-solunar" class="tab-content active">
      <div class="controls-row">
        <button class="burley-btn" id="burley-btn">🪣 Burley</button>
        <select class="loc-select" id="loc-select-main">
          <option value="mana">Mana Island</option>
          <option value="harbour">Wellington Harbour</option>
          <option value="south">South Coast</option>
        </select>
      </div>
      <div class="score-section">
        <div class="gauge-box">
          <svg class="gauge-svg" viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="48" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="8" stroke-dasharray="2 3.02" />
            <circle id="gauge-ticks" cx="60" cy="60" r="48" fill="none" stroke="#fff" stroke-width="8" stroke-dasharray="2 3.02" stroke-dashoffset="301.6" />
          </svg>
          <div class="score-val" id="score-val">--</div>
          <div class="stars-val" id="stars-val"></div>
        </div>
        <div class="label-val" id="label-val">--</div>
      </div>
      <div class="chart-container" id="chart-area">
        <span class="band-label band-high">HIGH</span><span class="band-label band-med">MEDIUM</span><span class="band-label band-low">LOW</span>
        <svg id="curve-svg" viewBox="0 0 440 214" preserveAspectRatio="none"></svg>
      </div>
      <div class="times-grid">
        <div class="times-col"><h3>Major Times</h3><div id="major-list"></div></div>
        <div class="times-col"><h3>Minor Times</h3><div id="minor-list"></div></div>
      </div>
      <div class="tide-panel">
        <div class="tide-header"><span id="tide-area-title">Area Tides</span><span class="tide-diff-badge" id="tide-diff-badge"></span></div>
        <div class="tide-list" id="tide-list"></div>
        <div class="burley-box" id="burley-box">
          <div class="burley-title">🪣 Best Burley Flow Windows</div>
          <div id="burley-list"></div>
        </div>
      </div>
    </div>

    <!-- TAB 2: ROUTING & TIMELINE -->
    <div id="tab-route" class="tab-content">
      <div class="module-panel">
        <div class="module-header">🛥️ Boat Profile & Route</div>
        <div class="input-grid">
          <div class="input-group"><label>Cruise Speed (Knots)</label><input type="number" id="boat-speed" value="20" onchange="runRoutingAndTimeline()"></div>
          <div class="input-group"><label>Fuel Burn (L/hr)</label><input type="number" id="boat-burn" value="25" onchange="runRoutingAndTimeline()"></div>
        </div>
        <div class="input-group">
          <label>Launch Ramp</label>
          <select id="ramp-select" onchange="runRoutingAndTimeline()">
            <option value="-41.0910,174.7830">Mana Island / Ngatitoa</option>
            <option value="-41.2980,174.7930">Evans Bay Marina</option>
            <option value="-41.3050,174.8290">Seatoun Boat Ramp</option>
          </select>
        </div>
        <div class="input-group" style="margin-top: 10px;">
          <label>Select Target Spots</label>
          <div class="spots-list" id="spots-checkboxes"></div>
        </div>
        <div id="map"></div>
        <div class="route-results">
          <span id="route-dist">Dist: 0.0 nm</span><span id="route-time">Time: 0h 0m</span><span id="route-fuel">Fuel: 0 L</span>
        </div>
      </div>
      <div class="module-panel">
        <div class="module-header">⏱️ Mission Timeline</div>
        <div class="input-grid">
          <div class="input-group"><label>Prep Buffer (Mins)</label><input type="number" id="prep-buffer" value="90" step="10" onchange="runRoutingAndTimeline()"></div>
          <div class="input-group">
            <label>Target Phase</label>
            <select id="target-phase" onchange="runRoutingAndTimeline()">
              <option value="major1">Major Window 1</option>
              <option value="major2">Major Window 2</option>
              <option value="minor1">Minor Window 1</option>
            </select>
          </div>
        </div>
        <div class="timeline-box" id="timeline-output"></div>
      </div>
    </div>

    <!-- TAB 3: GEAR CHECKLIST -->
    <div id="tab-gear" class="tab-content">
      <div class="module-panel">
        <div class="module-header">🎣 Loadout & Gear Check</div>
        <div class="input-group" style="margin-bottom: 15px;">
          <label>Target Species</label>
          <select id="species-select" onchange="renderChecklist()">
            <option value="general">General Bottom Fishing</option>
            <option value="kingfish">Kingfish (Jig/Livebait)</option>
            <option value="snapper">Snapper (Strayline/Softbait)</option>
          </select>
        </div>
        <div id="checklist-render"></div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
      <button class="nav-btn active" onclick="switchTab('solunar', this)">
        <span class="nav-icon">🌙</span><span>Solunar</span>
      </button>
      <button class="nav-btn" onclick="switchTab('route', this)">
        <span class="nav-icon">🗺️</span><span>Trip Plan</span>
      </button>
      <button class="nav-btn" onclick="switchTab('gear', this)">
        <span class="nav-icon">📋</span><span>Gear</span>
      </button>
    </div>
  </div>

  <script>
    // Tab Logic
    function switchTab(tabId, btnElement) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      btnElement.classList.add('active');
      if (tabId === 'route' && map) setTimeout(() => map.invalidateSize(), 200); // Fix map render issue in hidden tab
    }

    // Solunar Engine & Map Setup
    const LOCATIONS = {
      mana: { name: 'Mana Island', lat: -41.0910, lon: 174.7830, lunitidalHighHrs: 9.15, diffText: 'Tide: +4h 15m vs Harbour', currentFactor: 1.15 },
      harbour: { name: 'Wellington Harbour', lat: -41.2866, lon: 174.8300, lunitidalHighHrs: 4.90, diffText: 'Tide: Ref Port', currentFactor: 1.0 },
      south: { name: 'South Coast', lat: -41.3480, lon: 174.7700, lunitidalHighHrs: 4.15, diffText: 'Tide: -45m vs Harbour', currentFactor: 1.10 }
    };
    const savedSpots = [
      { name: "Mana Trench", lat: -41.0800, lon: 174.7600 }, { name: "Hunters Bank", lat: -41.0400, lon: 174.8100 },
      { name: "Makara Foul", lat: -41.2250, lon: 174.6850 }, { name: "Barrett Reef", lat: -41.3280, lon: 174.8350 }, { name: "Pencarrow Head", lat: -41.3650, lon: 174.8580 }
    ];

    let currentLocKey = 'mana';
    let selectedDate = new Date(); selectedDate.setHours(12, 0, 0, 0);
    let showBurleyMode = false;
    let currentData = null;
    let map, polyline, markers = [];

    // Astronomy Engine Logic (Stripped for brevity, relies on full integration from prior steps)
    const RAD = Math.PI / 180, DEG = 180 / Math.PI;
    function getMoonEphemeris(date) {
      const d = date.getTime() / 86400000 + 2440587.5 - 2451545.0;
      const L_sun = (280.4665 + 0.98564736 * d) % 360;
      const M_sun = (357.5291 + 0.98560028 * d) % 360;
      const lambda_sun = L_sun + 1.915 * Math.sin(M_sun * RAD);
      const L_moon = (218.3165 + 13.17639648 * d) % 360;
      const M_moon = (134.9634 + 13.06499295 * d) % 360;
      const D_elong = (297.8502 + 12.19074912 * d) % 360;
      const lon = L_moon + 6.289 * Math.sin(M_moon * RAD) + 1.274 * Math.sin((2 * D_elong - M_moon) * RAD);
      return { phaseAngle: ((lon - lambda_sun) % 360 + 360) % 360 };
    }

    function calculateSolunar(date, loc) {
      const dayStart = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const dayEnd = new Date(dayStart.getTime() + 86400000);
      const phaseRad = getMoonEphemeris(new Date(dayStart.getTime() + 43200000)).phaseAngle * RAD;
      const score = Math.max(5, Math.min(100, Math.round(55 - 42 * Math.cos(2 * phaseRad))));
      
      const observer = new Astronomy.Observer(loc.lat, loc.lon, 0);
      const searchStart = new Date(dayStart.getTime() - 8 * 3600000), searchEnd = new Date(dayEnd.getTime() + 8 * 3600000);
      const majors = [], minors = [];
      [0, 12].forEach(ha => { let t = searchStart; while (t < searchEnd) { const ev = Astronomy.SearchHourAngle(Astronomy.Body.Moon, observer, ha, t); if(!ev || ev.time.date >= searchEnd) break; majors.push(ev.time.date); t = new Date(ev.time.date.getTime() + 16 * 3600000); }});
      [+1, -1].forEach(dir => { let t = searchStart; while (t < searchEnd) { const ev = Astronomy.SearchRiseSet(Astronomy.Body.Moon, observer, dir, t, 1); if(!ev || ev.date >= searchEnd) break; minors.push(ev.date); t = new Date(ev.date.getTime() + 16 * 3600000); }});
      majors.sort((a,b)=>a-b); minors.sort((a,b)=>a-b);

      const tides = majors.map(t => new Date(t.getTime() + loc.lunitidalHighHrs * 3600000));
      const dayTides = []; tides.forEach(ht => {
        dayTides.push({time: new Date(ht.getTime() - 6.21 * 3600000), type: 'LOW'});
        dayTides.push({time: ht, type: 'HIGH'});
      }); dayTides.sort((a,b)=>a.time-b.time);

      const burleyWindows = [];
      for(let i=0; i<dayTides.length-1; i++){
        const bStart = new Date(dayTides[i].time.getTime() + 3600000);
        const bEnd = new Date(dayTides[i+1].time.getTime() - 3600000);
        if(bEnd > dayStart && bStart < dayEnd) burleyWindows.push({start: bStart, end: bEnd, flowDir: dayTides[i].type === 'LOW' ? 'Incoming Flood' : 'Outgoing Ebb'});
      }
      return { score, majors, minors, dayTides: dayTides.filter(t=>t.time>=dayStart && t.time<dayEnd), burleyWindows, dayStart, dayEnd, loc };
    }

    function formatClock(d) { let h = d.getHours(), m = d.getMinutes(); return `${h%12||12}:${m<10?'0':''}${m} ${h>=12?'pm':'am'}`; }
    
    function renderSolunar() {
      const loc = LOCATIONS[currentLocKey];
      currentData = calculateSolunar(selectedDate, loc);
      document.getElementById('score-val').textContent = currentData.score;
      document.getElementById('gauge-ticks').style.strokeDashoffset = (301.59 * (1 - currentData.score/100)).toFixed(2);
      
      const majs = currentData.majors.filter(t=>t>=currentData.dayStart && t<currentData.dayEnd);
      document.getElementById('major-list').innerHTML = majs.map(t=>`<div class="time-card">${formatClock(new Date(t.getTime()-4500000))} – ${formatClock(new Date(t.getTime()+4500000))}</div>`).join('');
      const mins = currentData.minors.filter(t=>t>=currentData.dayStart && t<currentData.dayEnd);
      document.getElementById('minor-list').innerHTML = mins.map(t=>`<div class="time-card">${formatClock(new Date(t.getTime()-2700000))} – ${formatClock(new Date(t.getTime()+2700000))}</div>`).join('');
      
      document.getElementById('tide-area-title').textContent = `${loc.name} Tides`;
      document.getElementById('tide-diff-badge').textContent = loc.diffText;
      document.getElementById('tide-list').innerHTML = currentData.dayTides.map(t => `<div class="tide-item"><span class="tide-type">${t.type}</span><span>${formatClock(t.time)}</span></div>`).join('');
      
      document.getElementById('burley-box').className = `burley-box ${showBurleyMode ? 'show' : ''}`;
      document.getElementById('burley-list').innerHTML = currentData.burleyWindows.map(bw => `<div class="burley-item"><span><strong>${bw.flowDir}:</strong></span><span>${formatClock(bw.start)} – ${formatClock(bw.end)}</span></div>`).join('');

      drawChart(currentData);
      runRoutingAndTimeline();
    }

    function drawChart(data) {
      const svg = document.getElementById('curve-svg');
      const W = 440, H = 214, leftPad = 62, rightPad = 12, topPad = 22, botPad = 34;
      const graphW = W - leftPad - rightPad, graphH = H - topPad - botPad;
      let html = `<line x1="${leftPad}" y1="${topPad+graphH*0.52}" x2="${W-rightPad}" y2="${topPad+graphH*0.52}" stroke="var(--grid-line)" stroke-dasharray="3,3" />`;
      
      const pts = [];
      for(let i=0; i<=60; i++) {
        const hr = (i/60)*24;
        const tMs = data.dayStart.getTime() + hr*3600000;
        let v = 18 + (data.score/100)*32;
        data.majors.forEach(m => { const dt = (tMs-m.getTime())/3600000; if(Math.abs(dt)<=3.1) v += (34+(data.score/100)*16)*Math.pow(Math.max(0, Math.cos(Math.PI*dt/3.1)), 1.25); });
        data.minors.forEach(m => { const dt = (tMs-m.getTime())/3600000; if(Math.abs(dt)<=2.1) v += (20+(data.score/100)*10)*Math.pow(Math.max(0, Math.cos(Math.PI*dt/2.1)), 1.35); });
        pts.push({x: leftPad + (hr/24)*graphW, y: topPad + graphH*(1 - Math.min(95, v)/100)});
      }
      
      const lineD = pts.map((p,i)=>`${i===0?'M':'L'} ${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
      const fillD = `${lineD} L ${(W-rightPad)},${H-botPad} L ${leftPad},${H-botPad} Z`;
      html += `<path d="${fillD}" fill="rgba(255,255,255,0.15)" /><path d="${lineD}" fill="none" stroke="#fff" stroke-width="2" />`;
      svg.innerHTML = html;
    }

    function initMap() {
      map = L.map('map', { zoomControl: false, attributionControl: false }).setView([-41.2866, 174.8300], 10);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      document.getElementById('spots-checkboxes').innerHTML = savedSpots.map((s,i) => `<label><input type="checkbox" class="spot-chk" value="${i}" onchange="runRoutingAndTimeline()"> ${s.name}</label>`).join('');
      if(document.querySelector('.spot-chk')) document.querySelector('.spot-chk').checked = true;
      runRoutingAndTimeline();
    }

    function getNmDistance(lat1, lon1, lat2, lon2) {
      const dLat = (lat2-lat1)*RAD, dLon = (lon2-lon1)*RAD;
      const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*RAD)*Math.cos(lat2*RAD)*Math.sin(dLon/2)*Math.sin(dLon/2);
      return 3440.065 * (2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    window.runRoutingAndTimeline = function() {
      if(!map || !currentData) return;
      markers.forEach(m => map.removeLayer(m)); if(polyline) map.removeLayer(polyline); markers = [];
      const ramp = document.getElementById('ramp-select').value.split(',').map(Number);
      const pts = [[ramp[0], ramp[1]]];
      document.querySelectorAll('.spot-chk:checked').forEach(c => pts.push([savedSpots[c.value].lat, savedSpots[c.value].lon]));
      pts.push([ramp[0], ramp[1]]);
      
      let totalNm = 0; for(let i=0; i<pts.length-1; i++) totalNm += getNmDistance(pts[i][0], pts[i][1], pts[i+1][0], pts[i+1][1]);
      const speed = parseFloat(document.getElementById('boat-speed').value) || 20;
      const tHrs = totalNm/speed;
      document.getElementById('route-dist').textContent = `Dist: ${totalNm.toFixed(1)} nm`;
      document.getElementById('route-time').textContent = `Time: ${Math.floor(tHrs)}h ${Math.round((tHrs%1)*60)}m`;
      document.getElementById('route-fuel').textContent = `Fuel: ${Math.ceil(tHrs * (parseFloat(document.getElementById('boat-burn').value)||25) * 1.3)} L`;
      
      polyline = L.polyline(pts, {color: '#00e676', weight: 3}).addTo(map);
      pts.forEach((p,i) => markers.push(L.circleMarker(p, {radius: 5, color: '#fff'}).addTo(map)));
      map.fitBounds(polyline.getBounds(), {padding: [10,10]});

      // Timeline Logic
      const majs = currentData.majors.filter(t=>t>=currentData.dayStart && t<currentData.dayEnd);
      const mins = currentData.minors.filter(t=>t>=currentData.dayStart && t<currentData.dayEnd);
      const pSel = document.getElementById('target-phase').value;
      let tgt = majs[0] || new Date(currentData.dayStart.getTime()+8*3600000);
      if(pSel==='major2' && majs.length>1) tgt = majs[1]; else if(pSel==='minor1' && mins.length>0) tgt = mins[0];
      
      const arr = new Date(tgt.getTime() - (pSel.includes('major')?4500000:2700000));
      const launch = new Date(arr.getTime() - (pts.length>2 ? getNmDistance(pts[0][0],pts[0][1],pts[1][0],pts[1][1])/speed*3600000 : 0));
      const wake = new Date(launch.getTime() - (parseInt(document.getElementById('prep-buffer').value)||90)*60000);
      
      document.getElementById('timeline-output').innerHTML = `
        <div class="tl-row"><div class="tl-time">${formatClock(wake)}</div><div class="tl-desc"><strong>Wake & Prep</strong><br>Hook up, checks, drive to ramp.</div></div>
        <div class="tl-row"><div class="tl-time">${formatClock(launch)}</div><div class="tl-desc"><strong>Launch Boat</strong></div></div>
        <div class="tl-row"><div class="tl-time">${formatClock(arr)}</div><div class="tl-desc"><strong>Arrive at Spot</strong><br>Lines in water. Window opening.</div></div>
        <div class="tl-row"><div class="tl-time">${formatClock(tgt)}</div><div class="tl-desc"><strong>Peak Activity</strong></div></div>`;
    };

    window.renderChecklist = function() {
      const sp = document.getElementById('species-select').value;
      let list = `
        <div class="checklist-group"><h4>Base Boat Safety</h4>
          <label class="check-item"><input type="checkbox"> Life Jackets (Checked & Fitted)</label>
          <label class="check-item"><input type="checkbox"> VHF Radio (Ch 16 working)</label>
          <label class="check-item"><input type="checkbox"> Flares & First Aid Kit</label>
          <label class="check-item"><input type="checkbox"> Anchor & Chain</label>
        </div>`;
      if(sp === 'kingfish') {
        list += `<div class="checklist-group"><h4>Kingfish Gear</h4>
          <label class="check-item"><input type="checkbox"> Heavy Jigging Rods (PE6-8)</label>
          <label class="check-item"><input type="checkbox"> 200g-300g Jigs & Assist Hooks</label>
          <label class="check-item"><input type="checkbox"> Livebait Net & Aerator Check</label>
          <label class="check-item"><input type="checkbox"> 80lb+ Fluorocarbon Trace</label></div>`;
      } else if (sp === 'snapper') {
        list += `<div class="checklist-group"><h4>Snapper Gear</h4>
          <label class="check-item"><input type="checkbox"> Strayline Rigs & Sinkers</label>
          <label class="check-item"><input type="checkbox"> Softbait Rods & Jerkshads</label>
          <label class="check-item"><input type="checkbox"> Burley Bombs & Dispenser</label></div>`;
      }
      document.getElementById('checklist-render').innerHTML = list;
    };

    function renderDateStrip() {
      const s = document.getElementById('date-strip'); s.innerHTML = ''; const td = new Date();
      for(let i=-3; i<=3; i++) {
        const d = new Date(selectedDate); d.setDate(d.getDate()+i);
        const cell = document.createElement('div'); cell.className = `date-item ${i===0?'active':''}`;
        cell.innerHTML = `<div class="day-num">${d.getDate()}</div><div class="day-name">${d.toDateString()===td.toDateString()?'TODAY':['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()]}</div>`;
        cell.onclick = () => { selectedDate = d; renderDateStrip(); renderSolunar(); }; s.appendChild(cell);
      }
    }

    document.getElementById('loc-select-main').onchange = (e) => { currentLocKey = e.target.value; renderSolunar(); };
    document.getElementById('burley-btn').onclick = function() { showBurleyMode = !showBurleyMode; this.classList.toggle('active'); renderSolunar(); };
    
    renderDateStrip(); setTimeout(() => { renderSolunar(); initMap(); renderChecklist(); }, 200);
  </script>
</body>
